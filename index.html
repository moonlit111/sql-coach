<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQL 教练</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css" />
    <!--
      sql.js loaded as UMD so it attaches `initSqlJs` to the global scope.
      We tried `+esm` and `esm.sh` but both ship subtly broken bundles:
      - esm.sh injects a Node `fs` shim that confuses Emscripten's runtime
        detection (unenv: fs.readFileSync is not implemented).
      - jsdelivr `+esm` does not export the factory as default.
      The classic UMD bundle works in every browser without repackaging.
    -->
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js"></script>
    <!--
      PDF export libraries (used by the Report view only). Loaded async
      so they don't block the main app boot — the report view checks
      for `window.html2canvas` / `window.jspdf` at click time and
      degrades gracefully if either is unavailable.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <!--
      We still declare an importmap so any code (including a future module
      worker) using bare specifiers like `import 'sql.js'` resolves to the
      same CDN. This keeps R4.3 satisfied — no bundler needed.

      CodeMirror 6 is loaded via esm.sh with `?external=` query strings.
      This is load-bearing: jsdelivr's `+esm` build (and esm.sh's default
      build) inline each package's dependencies, so `@codemirror/view`
      ships with its own copy of `@codemirror/state`, while
      `@codemirror/lang-sql` ships with another copy. instanceof checks
      across copies fail at runtime with "Unrecognized extension value
      in extension set". `?external=...` tells esm.sh to leave those
      imports unresolved so the importmap below picks the single shared
      version. Every package must list ALL of its CodeMirror / Lezer
      deps in the external list — get this wrong on one package and the
      whole editor refuses to construct an EditorState.
    -->
    <script type="importmap">
      {
        "imports": {
          "sql.js":                    "https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js",

          "@lezer/common":             "https://esm.sh/@lezer/common@1.2.1",
          "@lezer/lr":                 "https://esm.sh/@lezer/lr@1.4.2?external=@lezer/common",
          "@lezer/highlight":          "https://esm.sh/@lezer/highlight@1.2.1?external=@lezer/common",

          "@codemirror/state":         "https://esm.sh/@codemirror/state@6.4.1",
          "@codemirror/view":          "https://esm.sh/@codemirror/view@6.34.1?external=@codemirror/state",
          "@codemirror/language":      "https://esm.sh/@codemirror/language@6.10.3?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/lr,@lezer/highlight",
          "@codemirror/commands":      "https://esm.sh/@codemirror/commands@6.6.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common",
          "@codemirror/autocomplete":  "https://esm.sh/@codemirror/autocomplete@6.18.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@lezer/common",
          "@codemirror/lang-sql":      "https://esm.sh/@codemirror/lang-sql@6.8.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/lr,@lezer/highlight",
          "@codemirror/search":        "https://esm.sh/@codemirror/search@6.5.6?external=@codemirror/state,@codemirror/view"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
